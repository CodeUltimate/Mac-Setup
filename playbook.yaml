---
- name: Set up a Mac for development
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    zsh_custom: "{{ ansible_env.HOME }}/.oh-my-zsh/custom"

  tasks:
    - name: Install Homebrew formulae
      community.general.homebrew:
        name:
          - awscli
          - bitwarden-cli
          - docker
          - elinks
          - ettercap
          - git
          - htop
          - lsd
          - nmap
          - speedtest-cli
          - thefuck
          - tree
          - zsh
        state: present

    - name: Install Homebrew cask applications
      community.general.homebrew_cask:
        name:
          - brave-browser
          - google-chrome
          - charles
          - ferdium
          - spotify
          - intellij-idea
          - firefox
          - iterm2
          - visual-studio-code
          - sourcetree
          - tableplus
        state: present

    - name: Install oh-my-zsh
      ansible.builtin.shell: >
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      args:
        creates: "{{ ansible_env.HOME }}/.oh-my-zsh"

    - name: Install the zsh-autosuggestions plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ zsh_custom }}/plugins/zsh-autosuggestions"
        depth: 1

    - name: Install the zsh-syntax-highlighting plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ zsh_custom }}/plugins/zsh-syntax-highlighting"
        depth: 1

    - name: Install SDKMAN
      ansible.builtin.shell: curl -s "https://get.sdkman.io" | bash
      args:
        creates: "{{ ansible_env.HOME }}/.sdkman"

    - name: Copy configured zshrc
      ansible.builtin.copy:
        src: ./zshrc
        dest: "{{ ansible_env.HOME }}/.zshrc"
        backup: true

    - name: Create projects directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/projects"
        state: directory

    - name: Create tmp directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/tmp"
        state: directory
